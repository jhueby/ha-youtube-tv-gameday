tune_channel:
  fields:
    channel:
      required: true
      example: ESPN
      selector:
        text:
    label:
      example: LSU @ Kentucky
      selector:
        text:
    config_entry_id:
      selector:
        config_entry:
          integration: youtube_tv_gameday
open_app:
  fields:
    app:
      required: true
      example: Peacock
      selector:
        select:
          options: [Peacock, Paramount+, Prime Video, ESPN+, Apple TV, Netflix, Max]
    label:
      selector:
        text:
    config_entry_id:
      selector:
        config_entry:
          integration: youtube_tv_gameday
scoreboard:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: youtube_tv_gameday
